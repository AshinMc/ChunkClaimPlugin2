# ChunkClaimPlugin2 Configuration

# Language / Locale
# Set your language file to use (matches files in plugins/ChunkClaimPlugin2/lang/)
# Examples: en_US, es_ES, fr_FR, de_DE, pt_BR, ru_RU, zh_CN
locale: en_US

# Maximum number of chunks a player can claim (0 = unlimited)
max-claims-per-player: 10

# Item used to claim chunks on right click (Set to "NONE" to disable)
claim-item: "WOODEN_SHOVEL"

# Greeting display mode when entering a claimed chunk
# Options: ACTION_BAR, TITLE, SUBTITLE, CHAT, NONE
greeting-display: ACTION_BAR

# Show a subtle action bar message when leaving claimed land into the wilderness
show-wilderness-greeting: true

# Title message display duration (used when greeting-display is TITLE or SUBTITLE)
# 20 ticks = 1 second
title-duration:
  fade-in: 10
  stay: 60
  fade-out: 15

# Economy & Land Trading System
# Supports Vault (EssentialsX, CMI, etc.), physical Gold Banks (Gringotts),
# or native physical items (Gold Ingots, Diamonds, etc.) with NO extra plugins required.
economy:
  enabled: false

  # Mode:
  # - "AUTO"   : Uses Vault if detected on server; otherwise falls back to physical item economy
  # - "VAULT"  : Uses server Vault economy provider (virtual balance or Gringotts gold chests)
  # - "ITEM"   : Native physical item currency (deducted directly from player inventory)
  # - "NONE"   : Disables economy transactions
  mode: AUTO

  # Physical Item Currency settings (used in ITEM mode or AUTO fallback)
  item:
    material: "GOLD_INGOT"       # Any valid Minecraft item: GOLD_INGOT, DIAMOND, EMERALD, etc.
    display-name: "Gold"         # Currency label in messages (e.g. "10 Gold")
    convert-blocks: true         # Automatically count and convert 1 block = 9 ingots

  # Pricing and Refunds
  free-claims: 3                 # Number of chunks each player can claim before incurring costs
  cost-per-chunk: 10.0           # Base cost to claim a new chunk or expand
  cost-increase-per-chunk: 2.0   # Additional cost per existing chunk owned (0.0 for flat pricing)
  unclaim-refund-percentage: 50.0# Percentage refunded upon unclaiming (0.0 to disable refunds)

# Messages
messages:
  # Optional: override messages by key here.
  # Example:
  # chunk-claim-success: "&aChunk claimed!"
  # max-claims-reached: "&cYou have reached your maximum number of claims (%max%)."

# Message toggles - turn on/off specific action messages for all players
# Set to true to show the message, false to hide it
message-toggles:
  deny-break: true        # Message when block break is denied
  deny-place: true        # Message when block place is denied
  deny-interact: true     # Message when interaction is denied
  deny-entity: true       # Message when entity damage is denied
  deny-pvp: true          # Message when PvP is denied
  claim-success: true     # Message when chunk is claimed
  unclaim-success: true   # Message when chunk is unclaimed

# Particle settings
visualization:
  duration-seconds: 10
  particle-height: 100
  particle-spacing: 0.5
  # Default particle type for chunk borders. Players can override this per-player.
  # Valid types: FLAME, END_ROD, HEART, VILLAGER_HAPPY, REDSTONE, SNOWFLAKE, SOUL_FIRE_FLAME, CHERRY_LEAVES
  particle-type: FLAME

# Protection settings
protection:
  prevent-block-break: true
  prevent-block-place: true
  prevent-interactions: true

# Default claim flags (applied to new claims)
# Players can toggle these per-claim in /chunksettings -> Claims -> Claim Settings
claim-flags:
  mob-griefing: true     # Block mob griefing (snow trails, enderman, etc.)
  mob-spawning: false    # Block natural mob spawning
  mob-entry: false       # Block all mobs from entering the chunk (invisible wall)
  mob-protection: true   # Block players from attacking non-hostile mobs (cows, pigs, etc.)
  explosions: true       # Block explosion damage (creepers, TNT, etc.)
  pvp: false             # Block PvP combat
  fire-spread: true      # Block fire spread and burning in claim
  greeting-title: true   # Show welcome greeting when entering claim
  interact-chest: true
  interact-furnace: true
  interact-stonecutter: true
  interact-door: true
  interact-redstone: true

# Commands to run from console on certain events
# Available placeholders: %player%, %claim%
event-commands:
  claim-success: []
  # Example:
  # - "give %player% diamond 1"
  claim-fail: []
  unclaim-success: []